# Keeps content/changelog.md in step with the core's CHANGELOG.md. Runs
# scripts/changelog.py, which copies the released sections from the core's
# newest GitHub release, and commits the page when it changed. Runs daily
# and by hand from the Actions tab, so a release reaches the site within a
# day. A push made with the workflow's own token starts no other workflow,
# so the Pages workflow is started here when there is something new to
# publish.
name: Changelog
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Copy the released sections from the core
        id: sync
        run: echo "version=$(python scripts/changelog.py)" >> "$GITHUB_OUTPUT"
      - name: Commit the page when it changed, and publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/changelog.md; then
            echo "The changelog already follows ${{ steps.sync.outputs.version }}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "The changelog mirror follows the core's ${{ steps.sync.outputs.version }}" -- content/changelog.md
          git push
          gh workflow run pages.yml --ref main
