enableRobotsTXT = true
title = "Flashlights"
theme = "popular"
timeZone = "America/Vancouver"

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = "Docs"
  url = "/docs/what-it-is/"
  weight = 10
[[menu.main]]
  name = "Try it"
  url = "/docs/try-it/"
  weight = 20
[[menu.main]]
  name = "Deploy"
  url = "/docs/deploy/"
  weight = 30
[[menu.main]]
  name = "Changelog"
  url = "/changelog/"
  weight = 40
[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 50
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 60
[[menu.main]]
